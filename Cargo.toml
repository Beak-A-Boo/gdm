[package]
name = "gdm"
edition = "2024"
build = "build.rs"
description = "Godot Project Manager"
homepage = "https://beak-a-boo.com"
default-run = "gdm"

[[bin]]
name = "gdm-update"
path = "src/bin/update.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
dotenvy = { git = "https://github.com/allan2/dotenvy", rev = "cf125ddeb263c234ad83a46e5d4115b53888f24f", features = ["macros"] }
dunce = "1.0.5"
futures-util = "0.3.34"
indicatif = "0.18.6"
path-clean = "1.0.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
zip = "9.5.1"
const_format = "0.2.37"
rootcause = "0.13.0"

[build-dependencies]
built = { version = "0.8.1", features = ["git2"] }
